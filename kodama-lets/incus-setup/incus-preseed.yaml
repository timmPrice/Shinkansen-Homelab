# Configs used for initializing incus on kodama-lets
# ZFS utils must be installed, and incus systemd restarted (in that order) before initilizing

config:
  core.https_address: '[::]:8443'
networks:
  - config:
      ipv4.address: auto
      ipv6.address: auto
    description: ""
    name: incusbr0
    type: ""
    project: default
storage_pools:
  - config:
      source: /dev/ubuntu-vg/incus
    description: ""
    name: default
    driver: zfs
storage_volumes: []
profiles:
  - config: {}
    description: ""
    devices:
      eth0:
        name: eth0
        network: incusbr0
        type: nic
      root:
        path: /
        pool: default
        type: disk
    name: default
    project: default
projects: []
certificates: []
cluster_groups: []
cluster: null
